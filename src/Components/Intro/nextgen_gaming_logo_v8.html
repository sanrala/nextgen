
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
#ng-wrap{background:#0d0d0d;display:flex;align-items:center;justify-content:center;width:100%;height:260px;position:relative;overflow:hidden;}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);opacity:.4;z-index:5;}
#logo-svg{width:500px;height:250px;}
.r-track{fill:none;stroke:#1e1e1e;stroke-width:3;}
.r-arc{fill:none;stroke-linecap:round;}
.arc1{stroke:#cc1a1a;stroke-width:5;stroke-dasharray:310;stroke-dashoffset:310;animation:drawArc 1s cubic-bezier(.4,0,.2,1) forwards .1s;filter:drop-shadow(0 0 6px #cc1a1a99);}
.arc2{stroke:#a81515;stroke-width:3;stroke-dasharray:240;stroke-dashoffset:240;animation:drawArc 0.9s cubic-bezier(.4,0,.2,1) forwards .4s;}
.arc3{stroke:#8a0f0f;stroke-width:2;stroke-dasharray:180;stroke-dashoffset:180;animation:drawArc 0.8s cubic-bezier(.4,0,.2,1) forwards .65s;}
.arc4{stroke:#6b0a0a;stroke-width:1.5;stroke-dasharray:130;stroke-dashoffset:130;animation:drawArc 0.7s cubic-bezier(.4,0,.2,1) forwards .85s;}
.dot-glow{fill:#cc1a1a;opacity:0;animation:popDot .3s ease forwards 1.1s;filter:drop-shadow(0 0 5px #cc1a1a);}
@keyframes drawArc{to{stroke-dashoffset:0;}}
@keyframes popDot{0%{opacity:0;r:0;}70%{r:5;}100%{opacity:1;r:3.5;}}
.ltr{font-family:'Orbitron',sans-serif;font-weight:900;font-size:64px;fill:#fff;opacity:0;filter:drop-shadow(0 0 12px rgba(255,255,255,.25));}
.ltr-n1{animation:slideIn .5s cubic-bezier(.2,.8,.3,1) forwards 1.05s;}
.ltr-e1{animation:slideIn .5s cubic-bezier(.2,.8,.3,1) forwards 1.18s;}
.ltr-x{animation:slideIn .5s cubic-bezier(.2,.8,.3,1) forwards 1.31s;}
.ltr-t{animation:slideIn .5s cubic-bezier(.2,.8,.3,1) forwards 1.44s;}
.ltr-g{animation:slideIn .5s cubic-bezier(.2,.8,.3,1) forwards 1.57s;}
.ltr-e2{animation:slideIn .5s cubic-bezier(.2,.8,.3,1) forwards 1.70s;}
.ltr-n2{animation:slideIn .5s cubic-bezier(.2,.8,.3,1) forwards 1.83s;}
@keyframes slideIn{0%{opacity:0;transform:translateX(-35px) scaleX(.5);}60%{opacity:1;}100%{opacity:1;transform:translateX(0) scaleX(1);}}
.arrow-line{stroke:#cc1a1a;stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:drawLine 1s ease forwards 2.1s;filter:drop-shadow(0 0 4px #cc1a1aaa);}
.arrow-dot-l{fill:#cc1a1a;opacity:0;animation:popDot .3s ease forwards 2.05s;filter:drop-shadow(0 0 4px #cc1a1a);}
.arrow-dot-r{fill:#cc1a1a;opacity:0;animation:popDot .3s ease forwards 3.1s;filter:drop-shadow(0 0 4px #cc1a1a);}
@keyframes drawLine{to{stroke-dashoffset:0;}}
.gaming-lbl{font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;fill:#cc1a1a;opacity:0;filter:drop-shadow(0 0 8px rgba(204,26,26,.5));animation:fadeUp .6s ease forwards 3.2s;}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
</style>
<div id="ng-wrap">
  <div id="scan"></div>
  <svg id="logo-svg" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">

    <!-- Miroir + rotation -225° (cumul : -180° - 45°) -->
    <g transform="translate(150,0) scale(-1,1)">
      <g transform="rotate(-225 75 105)">
        <circle class="r-track" cx="75" cy="105" r="72"/>
        <circle class="r-track" cx="75" cy="105" r="58"/>
        <circle class="r-track" cx="75" cy="105" r="44"/>
        <circle class="r-track" cx="75" cy="105" r="30"/>
        <circle class="r-arc arc1" cx="75" cy="105" r="72" transform="rotate(100 75 105)"/>
        <circle class="r-arc arc2" cx="75" cy="105" r="58" transform="rotate(-40 75 105)"/>
        <circle class="r-arc arc3" cx="75" cy="105" r="44" transform="rotate(60 75 105)"/>
        <circle class="r-arc arc4" cx="75" cy="105" r="30" transform="rotate(-120 75 105)"/>
        <circle class="dot-glow" cx="75" cy="33" r="3.5"/>
        <circle class="dot-glow" cx="3" cy="105" r="3" style="animation-delay:1.2s"/>
      </g>
    </g>

    <!-- Lettres NEXTGEN -->
    <text class="ltr ltr-n1" x="53"  y="141">N</text>
    <text class="ltr ltr-e1" x="101" y="141">Ξ</text>
    <text class="ltr ltr-x"  x="145" y="141">X</text>
    <text class="ltr ltr-t"  x="193" y="141">T</text>
    <text class="ltr ltr-g"  x="238" y="141">G</text>
    <text class="ltr ltr-e2" x="286" y="141">E</text>
    <text class="ltr ltr-n2" x="332" y="141">N</text>

    <!-- Flèche -->
    <circle class="arrow-dot-l" cx="145" cy="150" r="3.5"/>
    <polyline class="arrow-line" points="145,150 145,160 378,160 378,150"/>
    <circle class="arrow-dot-r" cx="378" cy="150" r="3.5"/>

    <!-- GAMING -->
    <text class="gaming-lbl" x="193" y="182" textLength="141" lengthAdjust="spacingAndGlyphs">GAMING</text>

  </svg>
</div>
