<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Gaming</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0d0d0d;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Scanlines */
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:200;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,.06) 2px, rgba(0,0,0,.06) 3px);
}

/* ══ INTRO WRAPPER ══ */
.intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d0d0d;
  z-index: 50;
  animation: introOut 0.8s ease forwards 5.8s;
}
@keyframes introOut { to { opacity:0; visibility:hidden; } }

/* ══ STAGE : reproduit exactement les proportions du logo final ══ 
   Logo réel = 380×205px
   On travaille en 760×410 (x2) pour avoir de la précision
*/
.stage {
  position: relative;
  width: 760px;
  height: 410px;
}

/* ─── ÉLÉMENT 1 : Cercle rouge ───
   Dans le logo : le cercle occupe la partie gauche,
   centré verticalement, ~0 à 37% de la largeur
   Position finale : left=0, top=50%, transform translateY(-50%)
   Taille finale : ~280px
*/
.el-cercle {
  position: absolute;
  width: 280px;
  height: 280px;
  left: 0px;
  top: 50%;
  transform: translateY(-50%) scale(3);
  object-fit: contain;
  opacity: 0;
  z-index: 5;
  filter: drop-shadow(0 0 25px rgba(196,20,20,.85));
  animation:
    cercleAppear 0.7s cubic-bezier(0.15,0.85,0.3,1) forwards 0.1s,
    cercleLand   0.65s cubic-bezier(0.4,0,0.2,1)    forwards 0.9s;
}
@keyframes cercleAppear {
  0%   { opacity:0; transform:translateY(-50%) scale(3); }
  100% { opacity:1; transform:translateY(-50%) scale(1.4); }
}
@keyframes cercleLand {
  0%   { transform:translateY(-50%) scale(1.4); filter:drop-shadow(0 0 25px rgba(196,20,20,.85)); }
  100% { transform:translateY(-50%) scale(1);   filter:drop-shadow(0 0 10px rgba(196,20,20,.4)); }
}

/* ─── ÉLÉMENT 2 : NEXTGEN ───
   Position finale : centré verticalement, commence à ~33% de la largeur
   Le N déborde légèrement sur le cercle
*/
.el-nextgen {
  position: absolute;
  width: 500px;
  left: 200px;
  top: 50%;
  transform: translateY(-60%) translateX(-60px);
  object-fit: contain;
  opacity: 0;
  z-index: 6;
  filter: drop-shadow(0 0 12px rgba(255,255,255,.2));
  animation: nextgenIn 0.7s cubic-bezier(0.15,0.85,0.3,1) forwards 1.7s;
}
@keyframes nextgenIn {
  0%   { opacity:0; transform:translateY(-60%) translateX(-60px); filter:drop-shadow(0 0 30px rgba(255,255,255,.5)); }
  60%  { opacity:1; }
  100% { opacity:1; transform:translateY(-60%) translateX(0);     filter:drop-shadow(0 0 12px rgba(255,255,255,.2)); }
}

/* ─── ÉLÉMENT 3 : Flèche ───
   Arrive depuis la droite, se place sous NEXTGEN
   Position finale : droite du logo, en bas
*/
.el-fleche {
  position: absolute;
  width: 420px;
  right: 0px;
  top: 50%;
  transform: translateY(10%) translateX(80px);
  object-fit: contain;
  opacity: 0;
  z-index: 7;
  filter: drop-shadow(0 0 6px rgba(196,20,20,.5));
  animation: flecheIn 0.7s cubic-bezier(0.15,0.85,0.3,1) forwards 2.5s;
}
@keyframes flecheIn {
  0%   { opacity:0; transform:translateY(10%) translateX(80px); }
  50%  { opacity:1; }
  100% { opacity:1; transform:translateY(10%) translateX(0); }
}

/* ─── ÉLÉMENT 4 : GAMING ───
   Monte depuis le bas, sous la flèche
*/
.el-gaming {
  position: absolute;
  width: 280px;
  right: 10px;
  top: 50%;
  transform: translateY(68%) translateX(0);
  object-fit: contain;
  opacity: 0;
  z-index: 8;
  filter: drop-shadow(0 0 8px rgba(196,20,20,.5));
  animation: gamingIn 0.6s cubic-bezier(0.15,0.85,0.3,1) forwards 3.3s;
}
@keyframes gamingIn {
  0%   { opacity:0; transform:translateY(85%) translateX(0); }
  100% { opacity:1; transform:translateY(68%) translateX(0); }
}

/* ─── LOGO FINAL : fade in par-dessus pour le résultat pixel-perfect ─── */
.el-logo-final {
  position: absolute;
  width: 720px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  object-fit: contain;
  opacity: 0;
  z-index: 20;
  animation:
    logoIn   0.6s ease forwards 4.2s,
    logoGlow 2s ease-in-out infinite alternate 4.8s;
}
@keyframes logoIn {
  0%   { opacity:0; transform:translate(-50%,-50%) scale(.97); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
}
@keyframes logoGlow {
  0%   { filter:drop-shadow(0 0 6px rgba(196,20,20,.3)); }
  100% { filter:drop-shadow(0 0 20px rgba(196,20,20,.55)); }
}

/* ══ PAGE D'ACCUEIL ══ */
#homepage {
  opacity:0;
  text-align:center;
  animation: pageIn 0.8s ease forwards 6.4s;
}
@keyframes pageIn { to { opacity:1; } }
#homepage img { width:400px; }
#homepage p {
  color:#3a3a3a;
  font-family:'Courier New',monospace;
  font-size:11px;
  letter-spacing:5px;
  text-transform:uppercase;
  margin-top:28px;
}
</style>
</head>
<body>

<!-- ══ INTRO ══ -->
<div class="intro">
  <div class="stage">
    <!-- 1. Cercle rouge -->
    <img class="el-cercle"  src="cercle_t.png"  alt="">
    <!-- 2. NEXTGEN -->
    <img class="el-nextgen" src="nextgen_t.png" alt="">
    <!-- 3. Flèche depuis la droite -->
    <img class="el-fleche"  src="fleche_t.png"  alt="">
    <!-- 4. GAMING -->
    <img class="el-gaming"  src="gaming_t.png"  alt="">
    <!-- 5. Logo final pixel-perfect -->
    <img class="el-logo-final" src="logo_t.png" alt="NextGen Gaming">
  </div>
</div>

<!-- ══ PAGE D'ACCUEIL ══ -->
<div id="homepage">
  <img src="logo_t.png" alt="NextGen Gaming">
  <p>Bienvenue</p>
</div>

</body>
</html>
