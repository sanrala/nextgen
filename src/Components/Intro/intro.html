<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Gaming</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0d0d0d;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:200;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,.06) 2px, rgba(0,0,0,.06) 3px);
}

.intro {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d0d0d;
  z-index: 50;
  animation: introOut 0.8s ease forwards 5.8s;
}
@keyframes introOut { to { opacity:0; visibility:hidden; } }

/*
  STAGE = exactement les proportions du logo réel (380x205)
  On scale x2 = 760x410 pour travailler confortablement
  Tous les éléments sont positionnés pour qu'à la fin
  ils correspondent exactement au logo.
*/
.stage {
  position: relative;
  width: 760px;
  height: 410px;
}

/* ═══════════════════════════════════════
   CERCLE ROUGE
   Dans le logo : centre à ~x=130, y=205 (milieu vertical)
   Taille : ~260px de diamètre
═══════════════════════════════════════ */
.el-cercle {
  position: absolute;
  width: 260px;
  height: 260px;
  /* Position finale : centré verticalement à gauche */
  left: 0px;
  top: 75px; /* (410-260)/2 */
  object-fit: contain;
  opacity: 0;
  z-index: 5;
  transform-origin: center center;
  animation:
    cercleIn   0.8s cubic-bezier(0.15,0.85,0.3,1) forwards 0.1s,
    cercleFix  0.5s cubic-bezier(0.4,0,0.2,1)     forwards 1.0s;
}
@keyframes cercleIn {
  0%   { opacity:0; transform: scale(2.8); filter:drop-shadow(0 0 40px rgba(196,20,20,1)); }
  100% { opacity:1; transform: scale(1);   filter:drop-shadow(0 0 15px rgba(196,20,20,.6)); }
}
@keyframes cercleFix {
  0%   { filter:drop-shadow(0 0 15px rgba(196,20,20,.6)); }
  100% { filter:drop-shadow(0 0 6px rgba(196,20,20,.3)); }
}

/* ═══════════════════════════════════════
   NEXTGEN
   Dans le logo : commence à x≈205 (après le cercle),
   baseline verticale ≈ milieu, légèrement au-dessus centre
   Le N déborde sur le cercle (left≈180)
   Hauteur du texte ≈ 120px
═══════════════════════════════════════ */
.el-nextgen {
  position: absolute;
  width: 530px;
  height: 130px;
  left: 175px;   /* N déborde légèrement sur le cercle */
  top: 120px;    /* centré verticalement */
  object-fit: contain;
  object-position: left center;
  opacity: 0;
  z-index: 6;
  animation: nextgenIn 0.65s cubic-bezier(0.15,0.85,0.3,1) forwards 1.6s;
}
@keyframes nextgenIn {
  0%   { opacity:0; transform:translateX(-50px); filter:drop-shadow(0 0 25px rgba(255,255,255,.5)); }
  60%  { opacity:1; }
  100% { opacity:1; transform:translateX(0);     filter:drop-shadow(0 0 8px rgba(255,255,255,.15)); }
}

/* ═══════════════════════════════════════
   FLÈCHE
   Dans le logo : sous NEXTGEN, côté droit
   Part de ~x=350 jusqu'à x=760
   Verticalement : ≈ y=270 (sous le texte)
═══════════════════════════════════════ */
.el-fleche {
  position: absolute;
  width: 420px;
  height: 100px;
  left: 340px;
  top: 248px;
  object-fit: contain;
  object-position: left center;
  opacity: 0;
  z-index: 7;
  animation: flecheIn 0.7s cubic-bezier(0.15,0.85,0.3,1) forwards 2.4s;
}
@keyframes flecheIn {
  0%   { opacity:0; transform:translateX(60px); filter:drop-shadow(0 0 15px rgba(196,20,20,.8)); }
  50%  { opacity:1; }
  100% { opacity:1; transform:translateX(0);    filter:drop-shadow(0 0 4px rgba(196,20,20,.3)); }
}

/* ═══════════════════════════════════════
   GAMING
   Dans le logo : en dessous de la flèche, aligné à droite
   ≈ x=430, y=315
═══════════════════════════════════════ */
.el-gaming {
  position: absolute;
  width: 330px;
  height: 80px;
  left: 430px;
  top: 310px;
  object-fit: contain;
  object-position: left center;
  opacity: 0;
  z-index: 8;
  animation: gamingIn 0.55s cubic-bezier(0.15,0.85,0.3,1) forwards 3.2s;
}
@keyframes gamingIn {
  0%   { opacity:0; transform:translateY(15px); filter:drop-shadow(0 0 15px rgba(196,20,20,.8)); }
  100% { opacity:1; transform:translateY(0);    filter:drop-shadow(0 0 6px rgba(196,20,20,.4)); }
}

/* ═══════════════════════════════════════
   LOGO FINAL — pixel-perfect par-dessus tout
═══════════════════════════════════════ */
.el-logo-final {
  position: absolute;
  width: 760px;
  height: 410px;
  left: 0; top: 0;
  object-fit: contain;
  opacity: 0;
  z-index: 20;
  animation:
    logoIn   0.5s ease forwards 4.2s,
    logoGlow 2s ease-in-out infinite alternate 4.7s;
}
@keyframes logoIn {
  0%   { opacity:0; }
  100% { opacity:1; }
}
@keyframes logoGlow {
  0%   { filter:drop-shadow(0 0 5px rgba(196,20,20,.25)); }
  100% { filter:drop-shadow(0 0 18px rgba(196,20,20,.5)); }
}

/* ══ PAGE D'ACCUEIL ══ */
#homepage {
  opacity:0;
  text-align:center;
  animation: pageIn 0.8s ease forwards 6.4s;
}
@keyframes pageIn { to { opacity:1; } }
#homepage img { width:400px; }
#homepage p {
  color:#333;
  font-family:'Courier New',monospace;
  font-size:11px;
  letter-spacing:5px;
  text-transform:uppercase;
  margin-top:24px;
}
</style>
</head>
<body>

<div class="intro">
  <div class="stage">
    <img class="el-cercle"     src="cercle_t.png"  alt="">
    <img class="el-nextgen"    src="nextgen_t.png" alt="">
    <img class="el-fleche"     src="fleche_t.png"  alt="">
    <img class="el-gaming"     src="gaming_t.png"  alt="">
    <img class="el-logo-final" src="logo_t.png"    alt="NextGen Gaming">
  </div>
</div>

<div id="homepage">
  <img src="logo_t.png" alt="NextGen Gaming">
  <p>Bienvenue</p>
</div>

</body>
</html>
